name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs every day at midnight
  workflow_dispatch:               # Allows you to run it manually
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anthonyburt
          template: classic
          base: header, metadata
          config_timezone: America/New_York
          config_display: large
          
          # 1. Activity - Replaces the broken habits plugin. 
          # Shows a clean list of your most recent commits and events.
          plugin_activity: yes
          plugin_activity_limit: 8     # Shows a more substantial list
          plugin_activity_days: 30     # Looks back a full month
          plugin_activity_filter: push, issue, pull_request, member

          # 2. Achievements - Great for a "Senior/Lead" profile.
          # Shows milestones like "Pull Shark" or "Commit Streak".
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

          # 3. Languages - Your strongest asset (80%+ TypeScript)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          
          # 4. Lines of Code - Shows the total volume of work
          plugin_lines: yes
          
          # 5. Repositories - Kept to 'owner' as requested
          plugin_repositories: yes
          plugin_repositories_affiliations: owner
