name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anthonyburt
          template: classic
          # Using header and metadata for a clean top section
          base: header, metadata
          config_timezone: America/New_York
          config_display: large
          
          # 1. Languages - Shows your 80%+ TypeScript focus
          plugin_languages: yes
          plugin_languages_sections: most-used
          
          # 2. Isometric Calendar - The best way to show 'Habits' visually
          # This is very stable and shows your activity over 180 days.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 3. Commits - This replaces 'Recent Activity'
          # It provides the data you want (commits, frequency) but is more stable.
          plugin_commits: yes

          # 4. Lines of Code - Shows the volume of your work
          plugin_lines: yes
