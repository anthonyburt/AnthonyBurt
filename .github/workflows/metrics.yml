name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs every day at midnight
  workflow_dispatch:               # Allows you to run it manually
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anthonyburt
          template: terminal
          base: header, community, metadata
          config_timezone: America/New_York
          
          # Habits plugin - highlights your productivity patterns
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Languages plugin - aggregates private and public code
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          
          # Isometric calendar - 3D visualization of your contributions
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
