name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs every day at midnight
  workflow_dispatch:               # Allows you to run it manually
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anthonyburt
          template: classic
          base: header, metadata
          config_timezone: America/New_York
          
          # Sets a professional high-contrast look
          config_display: large
          
          # Coding Habits - Fixed the 'author' error by narrowing event fetch
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Languages - Shows your deep TypeScript expertise
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          
          # Lines of Code - Replaces the 'odd' calendar with readable stats
          plugin_lines: yes
          
          # Repositories - Optional: set to 'owner' to avoid leaking client work
          plugin_repositories: yes
          plugin_repositories_affiliations: owner
