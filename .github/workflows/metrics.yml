name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs every day at midnight
  workflow_dispatch:               # Allows you to run it manually
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anthonyburt
          template: terminal
          # Use 'header' and 'metadata' to keep it focused on code, not social stats
          base: header, metadata 
          config_timezone: America/New_York
          
          # HIDE THE PURPLE: Use a different color palette
          # Options: 'classic', 'terminal', 'repository'
          # We can also force a dark theme to keep it professional
          config_theme: dark 
          
          plugin_languages: yes
          plugin_languages_sections: most-used
          
          # BETTER ACTIVITY: Replace isocalendar with 'lines' and 'habits'
          # This shows your actual code impact rather than a tiny 3D map
          plugin_lines: yes
          
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
