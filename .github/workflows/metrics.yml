name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}] # Runs every day at midnight
  workflow_dispatch:               # Allows you to run it manually
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
       - uses: lowlighter/metrics@latest
         with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: anthonyburt
          template: classic
          base: header, metadata
          config_timezone: America/New_York
          
          # This forces the dark theme and removes the purple background
          config_display: large
          
          # Languages plugin (aggregates private work)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          
          # Replacing isocalendar with 'Lines' - much better for EM/QA roles
          # It shows your actual impact on the codebase
          plugin_lines: yes
          
          # Habits - shows when you're most active
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
